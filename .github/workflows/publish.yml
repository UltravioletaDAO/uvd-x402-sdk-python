name: Publish to PyPI

# Manual only: it is run from the Actions tab, on main, with the version to publish. It never runs
# on push, tag, release or merge; the tag v<version> is still created after a release, and it
# triggers nothing. Trusted publishing (OIDC): PyPI trusts this repository, this file and the
# `pypi` environment, and hands the upload job a token that lives for minutes. There is no API
# token in this repository to steal, and none is read here.
#
# check -> build -> publish. `check` runs only on main, checks the version and runs the tests;
# `build` makes dist/ without id-token; `publish` is the one job with id-token, and it runs in
# the `pypi` environment, which deploys from main only and has no required reviewer: nobody
# approves the upload. What guards it is main only, workflow_dispatch only, OIDC with no token,
# and the road to main (review, green CI).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must equal pyproject.toml"
        required: true
        type: string

permissions:
  contents: read # the job that publishes adds id-token itself

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # The tests run here, with read access only: their dependencies are unpinned, and nothing they
  # run shares a runner with the upload or its id-token. The interop contract (interop/: spec,
  # schemas, fixtures and vectors) and its runner go first, so a red conformance suite never
  # reaches PyPI and names itself; then the whole suite, installed as CI installs it, offline.
  check:
    name: Check branch, version and tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: The input version must be the package version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          pkg=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$INPUT_VERSION" != "$pkg" ]; then
            echo "::error::input $INPUT_VERSION, pyproject.toml $pkg"
            exit 1
          fi

      - name: The package keeps its name (PyPI trusts this workflow for that project)
        run: |
          name=$(sed -n 's/^name = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$name" != "uvd-x402-sdk" ]; then
            echo "::error::pyproject.toml name $name (want uvd-x402-sdk)"
            exit 1
          fi

      - name: Install the SDK with its test dependencies (the extras ci.yml installs)
        run: pip install -e '.[signer,dev,dx402,escrow,hedera,fastapi,flask,django]'

      - name: The OWS adapter is tested against the real library
        run: python -c "import ows"

      - name: Interop conformance
        run: python -m pytest -q tests/interop

      - name: Tests, offline
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: python -m pytest -q

  build:
    name: Build the sdist and the wheel
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Build, and check dist/ holds exactly this version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          pip install build==1.6.1
          python -m build
          ls -l dist/
          test -f "dist/uvd_x402_sdk-$INPUT_VERSION.tar.gz"
          test -f "dist/uvd_x402_sdk-$INPUT_VERSION-py3-none-any.whl"
          test "$(ls dist/ | wc -l)" -eq 2

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 15
    permissions:
      id-token: write # trusted publishing (OIDC); the only job that gets it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish with trusted publishing (no password, no twine)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
