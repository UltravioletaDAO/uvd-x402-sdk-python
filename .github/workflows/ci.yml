name: CI

on:
  push:
    branches: [main]
    # CI runs only when a file it reads changes. Each entry, and who reads it:
    #   src/**            the package: both jobs install it; cross-language also
    #                     puts src/ on PYTHONPATH and compares the ERC-8128
    #                     vectors in it byte for byte with the TypeScript SDK
    #   tests/**          the suite and its fixtures (`python -m pytest -q`)
    #   pyproject.toml    the manifest: dependencies, extras, pytest config (this
    #                     repo has no lockfile)
    #   .gitattributes    decides the bytes the checkout writes, and the vectors
    #                     are compared as bytes
    #   .github/workflows/ci.yml       this file
    #   .github/workflows/publish.yml  read by tests/test_publish_workflow.py and
    #                     tests/interop (TestPublishGate)
    #   README.md         the package readme (pyproject `readme`); two tests pin
    #                     its examples (test_readme_eurc_networks,
    #                     test_exact_amount)
    #   examples/**       run or scanned by test_dx402_examples, test_exact_amount
    #   interop/**        the interop contract: tests/interop validates its
    #                     schemas, fixtures and vectors, and reads the rules its
    #                     *.md write down
    #   scripts/near_kk_parity.py and scripts/near_registry_parity.py
    #                     run by cross-language against the TypeScript SDK
    #   scripts/release_tag.py  run by publish.yml's tag job, and against a
    #                     local remote by tests/test_release_tag.py
    # Everything else is left out: docs/, CHANGELOG.md and the other root *.md,
    # the other scripts/ (no job runs one), LICENSE. One of them IS read: test_exact_amount
    # scans docs/ for the float price form, so a docs-only change that brings it
    # back goes red on the next run, not on its own.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.gitattributes'
      - '.github/workflows/ci.yml'
      - '.github/workflows/publish.yml'
      - 'README.md'
      - 'examples/**'
      - 'interop/**'
      - 'scripts/release_tag.py'
      - 'scripts/near_kk_parity.py'
      - 'scripts/near_registry_parity.py'
      - 'scripts/near_ows_vectors.py'
      - 'scripts/near_ows_mutations.py'
      - 'scripts/near_erc8004_mutations.py'
  pull_request:
    # The same list as `push`, entry for entry.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.gitattributes'
      - '.github/workflows/ci.yml'
      - '.github/workflows/publish.yml'
      - 'README.md'
      - 'examples/**'
      - 'interop/**'
      - 'scripts/release_tag.py'
      - 'scripts/near_kk_parity.py'
      - 'scripts/near_registry_parity.py'
      - 'scripts/near_ows_vectors.py'
      - 'scripts/near_ows_mutations.py'
      - 'scripts/near_erc8004_mutations.py'

# Both jobs only read: this checkout, and the TypeScript SDK, which is public.
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        # `dx402` and `escrow` are not optional for the TEST run, whatever they
        # are for a consumer: durable-evidence seals and unseals (needs
        # `cryptography`) and advanced_escrow imports web3 at module level. A
        # module with no installable deps here is a module with no tests, and
        # the failure looks like ModuleNotFoundError rather than a gap. The same
        # for `fastapi`, `flask` and `django`: without them every middleware test
        # is skipped, and the ones that import a framework directly fail.
        run: pip install -e '.[signer,dev,dx402,escrow,hedera,fastapi,flask,django]'

      - name: The OWS adapter is tested against the real library
        # tests/test_ows_wallet_adapter.py skips what needs open-wallet-standard
        # when it is not installed. Here it must be: without it the adapter goes
        # untested against the real package while the suite stays green, which
        # is how it shipped an API nobody had measured.
        run: python -c "import ows"

      - name: Test
        env:
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_CONFIG_FILE: /dev/null
          AWS_EC2_METADATA_DISABLED: 'true'
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: python -m pytest -q

  # The one check this repo's own suite cannot make. Both SDK suites were green
  # while the two implementations diverged, because each validated itself
  # against vectors it had generated. This job spawns BOTH runtimes and makes
  # each verify what the other just signed. The driver lives in the TypeScript
  # SDK (one copy, not two) and is run here against THIS checkout. It has no
  # skip path: if Node or the TypeScript SDK is unavailable, the job fails.
  cross-language:
    name: Cross-language conformance (PY ↔ TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: uvd-x402-sdk-python

      - name: Check out the TypeScript SDK (it hosts the harness)
        uses: actions/checkout@v4
        with:
          repository: UltravioletaDAO/uvd-x402-sdk-typescript
          path: uvd-x402-sdk-typescript

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: uvd-x402-sdk-typescript/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install this SDK
        run: pip install -e '.[signer,near]'
        working-directory: uvd-x402-sdk-python

      - name: Install and build the TypeScript SDK
        working-directory: uvd-x402-sdk-typescript
        run: |
          npm ci
          npm run build

      # The conformance vectors must be the SAME FILE, byte for byte, in both
      # packages. A PR that edits this repo's copy alone fails here.
      - name: Vectors are the same file in both repos
        working-directory: uvd-x402-sdk-typescript
        env:
          UVD_X402_PY_ROOT: ${{ github.workspace }}/uvd-x402-sdk-python
        run: node scripts/derive-erc8128-f3-3.mjs --check

      - name: Sign in each runtime, verify in the other
        working-directory: uvd-x402-sdk-typescript
        env:
          UVD_X402_PY_ROOT: ${{ github.workspace }}/uvd-x402-sdk-python
          UVD_PYTHON: python
        run: node scripts/xlang/cross-language-conformance.mjs

      - name: NEAR golden-flow conformance (NEP-413, exact, storage, Arras logs)
        working-directory: uvd-x402-sdk-python
        run: python scripts/near_kk_parity.py --ts-root ../uvd-x402-sdk-typescript

      # Registry PR #69 owns these bytes. Pin its reviewed head while that PR
      # is separate from TS main; the other conformance checks keep following main.
      - name: Check out the shared registry fixture
        uses: actions/checkout@v4
        with:
          repository: UltravioletaDAO/uvd-x402-sdk-typescript
          ref: b4b70306125b69294d6b60bd79df60da44d68f1c
          path: uvd-x402-sdk-typescript-registry
          sparse-checkout: src/providers/near/vectors/near-registry.json
          sparse-checkout-cone-mode: false

      - name: NEAR registry vectors are the same file in both repos
        working-directory: uvd-x402-sdk-python
        run: python scripts/near_registry_parity.py --ts-root ../uvd-x402-sdk-typescript-registry
