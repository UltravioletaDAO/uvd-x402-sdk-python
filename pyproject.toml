[build-system]
requires = ["setuptools>=61.0,<70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uvd-x402-sdk"
version = "0.58.0"
description = "Python SDK for x402 payments - gasless crypto payments across 25 blockchains (including Robinhood Chain, XRPL, Scroll, SKALE). Features: ERC-8004 Trustless Agents, Escrow/Refunds, multi-stablecoin (USDC, EURC, AUSD, PYUSD, USDT, USDG)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Ultravioleta DAO", email = "dev@ultravioletadao.xyz" }
]
keywords = [
    "x402",
    "payments",
    "crypto",
    "usdc",
    "eurc",
    "stablecoin",
    "web3",
    "evm",
    "solana",
    "near",
    "stellar",
    "algorand",
    "sui",
    "xrpl",
    "xrp",
    "scroll",
    "skale",
    "robinhood",
    "usdg",
    "facilitator",
    "gasless",
    "eip-712",
    "eip-3009",
    "erc-8004",
    "trustless-agents",
    "escrow",
    "refund",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
signer = [
    "eth-account>=0.11.0",
]
dx402 = [
    "cryptography>=42.0.0",
    "eth-utils>=4.0.0",
    "eth-keys>=0.5.0",
    # eth-utils.keccak needs a hashing backend and does not pull one itself, so
    # without this a FRESH `pip install 'uvd-x402-sdk[dx402]'` raises
    # "None of these hashing backends are installed" on the first keccak call --
    # which is every content_hash, payment_id and anchor_digest. Invisible to
    # anyone whose environment already had pycryptodome via another dependency.
    "eth-hash[pycryptodome]>=0.7.0",
]
wallet = [
    "eth-account>=0.11.0",
]
web3 = [
    "web3>=6.0.0",
    "eth-account>=0.11.0",
]
escrow = [
    "web3>=6.0.0",
    "eth-account>=0.11.0",
]
flask = [
    "flask>=2.0.0",
]
fastapi = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
]
django = [
    "django>=4.0.0",
]
aws = [
    "boto3>=1.26.0",
]
algorand = [
    "py-algorand-sdk>=2.0.0",
]
all = [
    "uvd-x402-sdk[signer,wallet,web3,escrow,flask,fastapi,django,aws,algorand]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/UltravioletaDAO/uvd-x402-sdk-python"
Documentation = "https://docs.ultravioletadao.xyz/x402-sdk"
Repository = "https://github.com/UltravioletaDAO/uvd-x402-sdk-python"
Issues = "https://github.com/UltravioletaDAO/uvd-x402-sdk-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

# Autodiscovery ships ONLY .py files. Without this the ERC-8128 conformance
# vectors load fine from a source checkout and raise FileNotFoundError from an
# installed wheel — green locally, broken for every consumer.
[tool.setuptools.package-data]
uvd_x402_sdk = ["**/*.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
